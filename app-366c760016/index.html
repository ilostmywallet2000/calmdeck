<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calmdeck — Personal Command Center</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calmdeck">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bea'/%3E%3Cpath d='M8 19c2.5 3 5 4.5 8 4.5s5.5-1.5 8-4.5M16 7v16' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--panel-2:#faf9f6;--ink:#15171c;--ink-2:#3b3f48;--muted:#71757e;--line:#e8e6e0;
  --accent:#2f5bea;--accent-ink:#ffffff;--accent-soft:#eaf0ff;--good:#14855a;--good-soft:#e5f5ee;--warn:#b86e00;--warn-soft:#fdf2e1;--bad:#c63a3a;--bad-soft:#fdeaea;
  --r:14px;--shadow:0 1px 2px rgba(20,22,28,.04),0 6px 24px rgba(20,22,28,.05);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#0e1014;--panel:#161920;--panel-2:#1b1f27;--ink:#eceef3;--ink-2:#c4c8d1;--muted:#8d93a0;--line:#262a33;
  --accent:#7090ff;--accent-ink:#0b0d12;--accent-soft:#1c2440;--good:#3ccf8e;--good-soft:#12271f;--warn:#f0a83a;--warn-soft:#2a2112;--bad:#ff6b6b;--bad-soft:#2c1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;padding:4px 10px 18px}
.brand svg{width:28px;height:28px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav svg{width:18px;height:18px;flex:none;opacity:.8}
.nav:hover{background:var(--line)}
.nav.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.nav.on svg{color:var(--accent);opacity:1}
.side .foot{margin-top:auto;padding:12px;color:var(--muted);font-size:12px;line-height:1.45}
.lock{display:inline-flex;gap:6px;align-items:center}
main{padding:34px clamp(16px,4vw,48px) 90px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head h1{font-size:28px;letter-spacing:-.025em;margin:0;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:14px;margin:0 0 12px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
.stat .k{color:var(--muted);font-size:12.5px;font-weight:500}
.stat .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550;font-size:13.5px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad)}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:7px;display:inline-flex}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{color:var(--muted);font-size:12.5px}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.check{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:.15s}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;color:var(--accent-ink);opacity:0}
.check.on svg{opacity:1}
.done .t{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--line);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:18px 4px;text-align:center;font-size:13.5px}
.dots{display:flex;gap:4px}
.dot{width:20px;height:20px;border-radius:6px;background:var(--line);border:0;cursor:pointer;padding:0}
.dot.on{background:var(--good)}
.dot.today{outline:2px solid var(--accent);outline-offset:1px}
.callout{background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout b{color:var(--accent)}
.welcome{background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:20px}
.welcome h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.welcome p{margin:0 0 16px;color:var(--ink-2);max-width:620px}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inp,.fm input,.fm select,.fm textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px 11px;outline:none}
.inp:focus,.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(440px,calc(100vw - 32px));box-shadow:0 20px 70px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,12,16,.45);backdrop-filter:blur(3px)}
.fm{padding:22px}
.fm h3{margin:0 0 16px;font-size:17px}
.fm label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 12px}
.fm label span{display:block;margin-bottom:5px}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.seg{display:inline-flex;background:var(--line);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.goal{display:flex;flex-direction:column;gap:12px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{margin:0;font-size:16px;letter-spacing:-.01em}
.goal .why{color:var(--muted);font-size:13px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:550;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.mnav{display:none}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:10px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.tbl .r{text-align:right}
.scroll{overflow-x:auto}
.daygrp{font-size:12px;color:var(--muted);font-weight:600;padding:14px 2px 4px;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  .dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;width:100%}
  .dot{width:auto;height:auto;aspect-ratio:1}
  .side{display:none}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:10.5px;color:var(--muted);padding:6px 0;cursor:pointer;font-weight:550}
  .mnav button svg{width:20px;height:20px}
  .mnav button.on{color:var(--accent)}
  main{padding-top:22px}
  .g3,.g2{grid-template-columns:1fr}
  .head h1{font-size:24px}
  .hide-m{display:none}
  main{padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .inp,.fm input,.fm select,.fm textarea{font-size:16px;padding:11px 12px}
  .check{width:26px;height:26px}
  .icon-btn{padding:8px}
  .btn{padding:10px 16px}
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;border-bottom:0;max-height:92vh;overflow:auto}
  .fm{padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  .fm-actions .btn{flex:1;justify-content:center;padding:13px}
  .stat .v{font-size:22px}
}
.install{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.install .ico{width:40px;height:40px;flex:none}
.install p{margin:0;font-size:13.5px;color:var(--ink-2)}
.install b{color:var(--ink)}
.share-ic{display:inline-block;vertical-align:-3px;width:16px;height:16px;color:var(--accent)}
/* Calmdeck Brain + Coach */
.ins{display:flex;gap:12px;padding:12px 2px;border-top:1px solid var(--line);align-items:flex-start}
.ins:first-child{border-top:0}
.ins .dotc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px;background:var(--line)}
.ins.good .dotc{background:var(--good-soft)}.ins.warn .dotc{background:var(--warn-soft)}.ins.bad .dotc{background:var(--bad-soft)}.ins.info .dotc{background:var(--accent-soft)}
.ins b{display:block;font-weight:600;margin-bottom:1px}
.ins span{color:var(--ink-2);font-size:13.5px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:min(58vh,560px);overflow-y:auto;padding:6px 2px 10px;overscroll-behavior:contain}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.assistant{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.msg .saved{margin-top:8px;font-size:12px;color:var(--good);font-weight:600;white-space:normal}
.typing{color:var(--muted)}.typing::after{content:'…';animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:550;cursor:pointer;color:var(--ink-2)}
.chip:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.chip:disabled,.btn:disabled{opacity:.5;cursor:not-allowed}
.composer{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:160px;field-sizing:content}
.ai-label{font-size:11.5px;color:var(--muted);margin-top:3px}
.m-only{display:none}
@media (max-width:760px){.m-only{display:inline-flex}.msg{max-width:92%}.chat{max-height:52vh}}
</style>
</head>

<input type="file" id="file" accept="application/json,.json" hidden>

<script>
(()=>{
'use strict';
/* ---------- utilities ---------- */

const dt=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=dt(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return iso(d)};
const diffDays=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const daysInMonth=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weekStart=s=>{const d=dt(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

/* ---------- languages ---------- */
// Translations are keyed by the English text. A plural key holds "one|other" forms
// (Russian: "one|few|many"), picked with Intl.PluralRules.

const fill=(r,v)=>r.replace(/\{([\w/]+)\}/g,(m,k)=>v[k]!=null?v[k]:m);
function tr(s,v){
  let r=s;
  if(LANG!=='en'){const d=I18N[LANG];if(d&&d[s]!=null)r=d[s];else MISS.add(s)}
  return v?fill(r,v):r;
}
function trn(n,s,v){
  const forms=tr(s).split('|'),c=new Intl.PluralRules(LANG).select(n);
  const i=LANG==='ru'?(c==='one'?0:c==='few'?1:2):(c==='one'?0:1);
  return fill(forms[Math.min(i,forms.length-1)],Object.assign({n},v||{}));
}

  let raw=null;if(!DEMO)try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}

function normalize(){
  const t=today();
  S.memory=Object.assign(blank().memory,S.memory||{});if(!Array.isArray(S.memory.facts))S.memory.facts=[];
  if(!Array.isArray(S.chat))S.chat=[];S.chat=S.chat.filter(m=>!m.pending);
  S.subs.forEach(s=>{let g=0;while(s.next&&s.next<t&&g++<500)s.next=nextCycle(s.next,s.cycle)});
  const wk=weekStart(t);
  if(S.focus.week!==wk){S.focus.items=S.focus.items.filter(i=>!i.done);S.focus.week=wk}
}

function fmtCur(num){
  const c=(S.settings.currency||'$').trim();

}

function streak(h){let d=today(),n=0;if(!h.log[d])d=addDays(d,-1);while(h.log[d]){n++;d=addDays(d,-1)}return n}
function rate(h,days=30){let c=0;for(let i=0;i<days;i++)if(h.log[addDays(today(),-i)])c++;return Math.round(c/days*100)}
const prog=g=>g.steps.length?Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100):0;

/* ---------- Calmdeck Brain: insights computed on this device (no AI, no network) ---------- */
const prevMonth=m=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const FIXED=['Housing','Bills','Subscriptions'];
const spentUntil=(m,cat,day)=>txIn(m).filter(x=>x.type==='out'&&(!cat||x.cat===cat)&&+x.date.slice(8)<=day).reduce((a,x)=>a+x.amt,0);
function weekdayPattern(){
  const t=today(),from=addDays(t,-62);
  const out=S.tx.filter(x=>x.type==='out'&&x.date>from&&x.date<=t&&x.cat!=='Housing'&&x.cat!=='Bills');
  if(out.length<15)return null;
  const sum=[0,0,0,0,0,0,0];out.forEach(x=>sum[dt(x.date).getDay()]+=x.amt);
  const avg=sum.reduce((a,b)=>a+b,0)/7;if(!avg)return null;
  const i=sum.indexOf(Math.max(...sum)),p=Math.round((sum[i]/avg-1)*100);
  return p>=40?{day:WDN[LANG][i],p}:null;
}
function habitSplit(h){
  let wd=0,wdn=0,we=0,wen=0;
  for(let i=1;i<=28;i++){const d=addDays(today(),-i),w=dt(d).getDay(),on=h.log[d]?1:0;if(w===0||w===6){we+=on;wen++}else{wd+=on;wdn++}}
  return{wd:Math.round(wd/wdn*100),we:Math.round(we/wen*100)};
}
function insights(){
  const out=[],t=today(),m=t.slice(0,7),pm=prevMonth(m),dom=dt(t).getDate(),dim=daysInMonth(m),left=dim-dom+1,hour=new Date().getHours();
  const add=(tone,icon,title,text,score)=>out.push({tone,icon,title,text,score});
  const sp=spent(m),bud=totalBudget();
  if(bud&&dom>=5&&sp>0){
    // Fixed costs (rent, bills, subscriptions) happen once a month; only day-to-day spending is extrapolated.
    const fixed=FIXED.reduce((x,c)=>x+spent(m,c),0),proj=fixed+(sp-fixed)/dom*dim,over=proj-bud;
    if(sp>=bud)add('bad','🚨',tr('Monthly budget used up'),trn(left,"You've spent {x} of {y} with {n} day left.|You've spent {x} of {y} with {n} days left.",{x:money(Math.round(sp)),y:money(bud)}),95);
    else if(over>bud*.03)add('bad','📉',tr('Heading about {x} over budget',{x:money(Math.round(over))}),tr("At this pace you'll spend around {x} this month. Keeping to {y} a day brings you back on track.",{x:money(Math.round(proj)),y:money(Math.floor((bud-sp)/left))}),90);
    else if(over>0)add('warn','⚖️',tr('Right at your limit'),tr("At this pace you'll spend around {x}, just over your {y} budget. A few small cuts keep you inside it.",{x:money(Math.round(proj)),y:money(bud)}),64);
    else add('good','✅',tr('On track this month'),tr("At this pace you'll spend around {x}, inside your {y} budget.",{x:money(Math.round(proj)),y:money(bud)}),35);
  }
  CATS.forEach(c=>{
    const s=spent(m,c),b=+S.budgets[c]||0,ps=spentUntil(pm,c,dom),cn=catName(c);
    if(b&&s>b)add('bad','⚠️',tr('{c} is over budget',{c:cn}),tr('{x} spent of {y}, {z} over.',{x:money(Math.round(s)),y:money(b),z:money(Math.round(s-b))}),85);
    else if(b&&s>=b*.85&&left>5&&!FIXED.includes(c))add('warn','⏳',tr('{c} budget almost used',{c:cn}),trn(left,'{p}% used with {n} day still to go.|{p}% used with {n} days still to go.',{p:Math.round(s/b*100)}),70);
    if(c==='Housing'||ps<40)return;
    if(s>=ps*1.3)add('warn','📈',tr('{c} spending up {p}%',{c:cn,p:Math.round((s/ps-1)*100)}),tr('{x} so far this month vs {y} by the same day last month.',{x:money(Math.round(s)),y:money(Math.round(ps))}),60);
    else if(s<=ps*.7)add('good','👏',tr('{c} spending down {p}%',{c:cn,p:Math.round((1-s/ps)*100)}),tr('{x} so far vs {y} by this point last month.',{x:money(Math.round(s)),y:money(Math.round(ps))}),45);
  });
  const wp=weekdayPattern();
  if(wp)add('info','🗓️',tr('You spend most {day}',{day:wp.day}),tr('About {p}% more than your average day over the last two months, not counting rent and bills.',{p:wp.p}),50);
  const inc=income(m),pinc=income(pm);
  if(pinc>0){const r=Math.round((pinc-spent(pm))/pinc*100);
    add(r>=20?'good':r>=0?'info':'bad','💰',tr('Last month you saved {p}% of your income',{p:r}),r>=20?tr("That's a strong savings rate. Keep it up."):r>=0?tr('A common target is 20%. Small cuts add up fast.'):tr('You spent more than you earned last month.'),r<0?80:30)}
  const subsM=subsYearly()/12;
  if(inc>0&&subsM/inc>=.07)add('warn','🔁',tr('Subscriptions take {p}% of your income',{p:Math.round(subsM/inc*100)}),tr("That's {x} a month, or {y} a year.",{x:money(Math.round(subsM)),y:money(Math.round(subsM*12))}),65);
  const fl=S.subs.filter(s=>s.flag);
  if(fl.length)add('warn','✂️',tr('Save {x} a year',{x:money(Math.round(fl.reduce((a,s)=>a+subYear(s),0)))}),tr('by cancelling the subscriptions you flagged: {list}.',{list:fl.map(s=>s.name).join(', ')}),75);
  S.subs.forEach(s=>{
    const h=(s.hist||[]).slice(-1)[0];
    if(h&&h.to>h.from&&diffDays(h.date,t)<=60)add('warn','💸',tr('{s} went up {p}%',{s:s.name,p:Math.round((h.to/h.from-1)*100)}),tr("From {x} to {y}. That's {z} more per year.",{x:money2(h.from),y:money2(h.to),z:money(Math.round((h.to-h.from)*PER_YEAR[s.cycle]))}),72);
    const n=diffDays(t,s.next);
    if(n>=0&&n<=3)add('info','🔔',n===0?tr('{s} renews today',{s:s.name}):n===1?tr('{s} renews tomorrow',{s:s.name}):trn(n,'{s} renews in {n} day|{s} renews in {n} days',{s:s.name}),tr('{x} will be charged. Still worth it?',{x:money2(s.amt)}),s.cycle==='yearly'?78:58);
    else if(s.cycle==='yearly'&&n>3&&n<=14)add('info','📅',tr('Big renewal coming: {s}',{s:s.name}),tr("{x} on {d}. Cancel before then if you don't need it.",{x:money2(s.amt),d:dayLabel(s.next)}),62);
  });
  let best=null;
  S.habits.forEach(h=>{
    const st=streak(h);if(!best||st>best.st)best={h,st};
    if(st>=3&&!h.log[t]&&hour>=17)add('warn','⏰',trn(st,'Keep your {n}-day streak alive|Keep your {n}-day streak alive'),tr("“{h}” isn't checked off yet today.",{h:h.name}),82);
    const x=habitSplit(h);
    if(x.wd>=50&&x.wd-x.we>=30)add('info','🌗',tr('“{h}” slips on weekends',{h:h.name}),tr('Done on {a}% of weekdays but {b}% of weekends over the last 4 weeks. Try a weekend-specific time or cue.',{a:x.wd,b:x.we}),55);
  });
  if(best&&best.st>=7)add('good','🔥',trn(best.st,'{n}-day streak: {h}|{n}-day streak: {h}',{h:best.h.name}),tr('Consistency like this is what makes a habit stick.'),48);
  S.goals.forEach(g=>{
    const p=prog(g),n=g.due?diffDays(t,g.due):null;if(p===100)return;
    if(!g.steps.length)add('info','🧩',tr('Break “{g}” into steps',{g:g.title}),tr('Goals with small, concrete steps are far more likely to get done.'),52);
    else if(n!==null&&n<0)add('bad','🎯',trn(-n,'“{g}” is {n} day overdue|“{g}” is {n} days overdue',{g:g.title}),tr('{p}% done. Set a new realistic date, or cut the scope.',{p}),76);

  });
  return out.sort((a,b)=>b.score-a.score);
}
function learned(){
  const t=today(),m=t.slice(0,7),L=[];
  const months=[];let x=m;for(let i=0;i<3;i++){x=prevMonth(x);if(txIn(x).length)months.push(x)}

    L.push(tr('Most consistent habit: “{h}” ({p}% of days).',{h:r[0].n,p:r[0].r}));
    if(r.length>1)L.push(tr('Hardest habit to keep: “{h}” ({p}% of days).',{h:r[r.length-1].n,p:r[r.length-1].r}));

}

  if(rec.length){P('Recent transactions, newest first:');rec.forEach(x=>P(`- ${x.date} ${x.type==='in'?'+':'-'}${money2(x.amt)} ${x.desc} [${x.type==='in'?'Income':x.cat}]`))}

  P('\n## Goals');

async function apiErr(res){
  let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}
  if(/credit balance/i.test(msg))return tr('Your Anthropic account is out of credit. Add credit at console.anthropic.com, under Billing.');
  if(res.status===401)return tr('Anthropic rejected that API key. Check it in Coach → AI Coach → Settings.');
  if(res.status===403)return tr("This API key isn't allowed to use that model.");
  if(res.status===404)return tr("That model isn't available on your account. Pick another model in Settings.");
  if(res.status===429)return tr('Too many requests, or your spend limit was reached. Wait a minute, or check your limits at console.anthropic.com.');
  if(res.status>=500)return tr('The AI service is busy right now. Try again in a moment.');
  return tr('The AI service returned an error.')+(msg?' '+msg:'');
}
async function callClaude(cfg,messages,{stream=true,max=4000,system}={}){
  const go=withFallback=>{
    const headers={'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    const body={model:cfg.model,max_tokens:max,stream,output_config:{effort:'low'},messages};
    if(system)body.system=system;
    // Server-side refusal fallback for Sonnet/Opus (Haiku has none).
    if(withFallback){headers['anthropic-beta']='server-side-fallback-2026-07-01';body.fallbacks='default'}
    return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)});
  };
  const fb=cfg.model!=='claude-haiku-5-5';
  let res;
  try{
    res=await go(fb);
    if(fb&&res.status===400&&/fallback/i.test(await res.clone().text()))res=await go(false);
  }catch(e){throw new Error(tr("Couldn't reach the AI service. Check your internet connection."))}
  if(!res.ok)throw new Error(await apiErr(res));
  return res;
}

async function sendChat(text){
  const cfg=ai();text=(text||'').trim();
  if(!cfg||!text||busy)return;
  S.chat.push({role:'user',content:text,t:Date.now()});
  const a={role:'assistant',content:'',t:Date.now(),pending:true};
  S.chat.push(a);busy=true;commit();scrollChat();
  const hist=S.chat.filter(m=>!m.pending&&!m.err&&m.content).slice(-30).map(m=>({role:m.role,content:m.role==='assistant'?visible(m.content):m.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const system=[{type:'text',text:COACH_RULES,cache_control:{type:'ephemeral'}},{type:'text',text:'# Their Calmdeck data (live)\n'+buildContext()}];
  try{
    const res=await callClaude(cfg,hist,{system});
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='',stop=null;
    for(;;){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
        let ev;try{ev=JSON.parse(line.slice(5))}catch(_){continue}
        if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){a.content+=ev.delta.text;paint(a)}
        else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason;
        else if(ev.type==='error')throw new Error((ev.error&&ev.error.message)||tr('The AI service returned an error.'));
      }
    }
    if(stop==='refusal'&&!visible(a.content).trim())a.content=tr("I can't help with that one, but I'm happy to help with your money, habits or goals.");
    if(stop==='max_tokens')a.content+='\n\n('+tr('Reply cut short.')+')';
    const saved=[];
    a.content=a.content.replace(/<remember>([\s\S]*?)<\/remember>/g,(_,f)=>{
      f=f.trim().slice(0,200);
      if(f&&saved.length<2&&!S.memory.facts.some(x=>x.text.toLowerCase()===f.toLowerCase())){S.memory.facts.push({id:uid(),text:f,src:'coach',date:today()});saved.push(f)}
      return'';
    }).replace(/<remember>[\s\S]*$/,'').trim();
    if(saved.length)a.saved=saved;
    if(!a.content)a.content=tr('(No reply. Please try again.)');
  }catch(e){a.content=e.message||String(e);a.err=true}
  finally{delete a.pending;busy=false;if(S.chat.length>200)S.chat=S.chat.slice(-200);commit();scrollChat()}
}

  return`<label><span>${f.label}</span><input name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" ${f.req?'required':''} ${f.type==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} maxlength="${f.max||120}"></label>`;
}
function form(title,fields,init,onSave){
  const dlg=$('#dlg');
  const body=fields.map(f=>Array.isArray(f)?`<div class="two">${f.map(x=>field(x,init[x.k])).join('')}</div>`:field(f,init[f.k])).join('');
  dlg.innerHTML=`<form method="dialog" class="fm"><h3>${esc(title)}</h3>${body}<div class="fm-actions"><button class="btn ghost" value="cancel" formnovalidate>${tr('Cancel')}</button><button class="btn primary" value="ok">${tr('Save')}</button></div></form>`;
  const fm=dlg.querySelector('form');
  fm.addEventListener('submit',e=>{
    if(e.submitter&&e.submitter.value==='cancel')return;
    e.preventDefault();const o={};
    fields.flat().forEach(f=>{let v=fm.elements[f.k].value.trim();if(f.type==='number')v=Math.round((parseFloat(v.replace(',','.'))||0)*100)/100;o[f.k]=v});
    onSave(o);commit();dlg.close();
  });
  dlg.showModal();const first=fm.querySelector('input,select');first&&first.focus();
}
const txFields=t=>[{k:'desc',label:tr('Description'),req:1,ph:t==='in'?tr('Salary, freelance…'):tr('Groceries, coffee…')},[{k:'amt',label:tr('Amount'),type:'number',req:1,ph:'0.00'},{k:'date',label:tr('Date'),type:'date',req:1,def:today()}],...(t==='out'?[{k:'cat',label:tr('Category'),type:'select',opts:CATS.map(c=>[c,catName(c)])}]:[])];
function txForm(type,x){
  form(x?tr('Edit transaction'):type==='in'?tr('Add income'):tr('Add expense'),txFields(type),x||{},o=>{
    if(x)Object.assign(x,o);else S.tx.push({id:uid(),type,cat:type==='in'?'Income':o.cat,...o});
    if(!x)toast(type==='in'?tr('Income added'):tr('Expense added'));
  });
}
function subForm(s){
  form(s?tr('Edit subscription'):tr('Add subscription'),[{k:'name',label:tr('Name'),req:1,ph:tr('e.g. Netflix')},[{k:'amt',label:tr('Price'),type:'number',req:1},{k:'cycle',label:tr('Billing'),type:'select',opts:Object.entries(CYCLES).map(([k,l])=>[k,tr(l)]),def:'monthly'}],{k:'next',label:tr('Next renewal date'),type:'date',req:1,def:addMonths(today(),1)},{k:'note',label:tr('Note (optional)'),ph:tr('Shared with family, annual plan…')}],s||{},o=>{
    if(s){if(o.amt!==s.amt)(s.hist=s.hist||[]).push({date:today(),from:s.amt,to:o.amt});Object.assign(s,o)}else S.subs.push({id:uid(),flag:false,...o});normalize();
  });
}

/* ---------- actions ---------- */
const find=(arr,id)=>arr.find(x=>x.id===id);
function commit(){delete S.fresh;save();render()}
const A={
  addTx:()=>txForm('out'),addIncome:()=>txForm('in'),
  editTx:id=>{const x=find(S.tx,id);txForm(x.type,x)},
  delTx:id=>{S.tx=S.tx.filter(x=>x.id!==id);commit();toast(tr('Transaction deleted'))},
  month:d=>{const[y,m]=month.split('-').map(Number);const n=new Date(y,m-1+(+d),1);month=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render()},
  editBudgets:()=>form(tr('Monthly budgets'),CATS.filter(c=>c!=='Other').reduce((a,c,i)=>{const f={k:c,label:catName(c),type:'number',ph:tr('No limit')};if(i%2===0)a.push([f]);else a[a.length-1].push(f);return a},[]),S.budgets,o=>{S.budgets={};for(const k in o)if(o[k]>0)S.budgets[k]=o[k];toast(tr('Budgets saved'))}),
  addSub:()=>subForm(),editSub:id=>subForm(find(S.subs,id)),
  delSub:id=>{if(confirm(tr('Remove this subscription?'))){S.subs=S.subs.filter(x=>x.id!==id);commit()}},
  flagSub:id=>{const s=find(S.subs,id);s.flag=!s.flag;commit()},
  addHabit:()=>form(tr('New habit'),[{k:'name',label:tr('Habit'),req:1,ph:tr('e.g. Walk 20 minutes'),max:60}],{},o=>{S.habits.push({id:uid(),name:o.name,log:{}})}),
  delHabit:id=>{if(confirm(tr('Delete this habit and its history?'))){S.habits=S.habits.filter(x=>x.id!==id);commit()}},
  togHabit:(id,el)=>{const h=find(S.habits,id),d=el.dataset.d;if(h.log[d])delete h.log[d];else h.log[d]=1;commit()},
  addGoal:()=>form(tr('New goal'),[{k:'title',label:tr('Goal'),req:1,ph:tr('e.g. Build a 3-month emergency fund')},{k:'why',label:tr('Why it matters (optional)'),ph:tr('Peace of mind')},{k:'due',label:tr('Target date (optional)'),type:'date'}],{},o=>{S.goals.unshift({id:uid(),steps:[],...o})}),
  delGoal:id=>{if(confirm(tr('Delete this goal?'))){S.goals=S.goals.filter(x=>x.id!==id);commit()}},
  togStep:(id,el)=>{const s=find(S.goals,id).steps[el.dataset.i];s.done=!s.done;commit()},
  delStep:(id,el)=>{find(S.goals,id).steps.splice(el.dataset.i,1);commit()},
  addStep:id=>{const inp=document.querySelector(`.step-in[data-id="${id}"]`);const v=inp.value.trim();if(!v)return inp.focus();find(S.goals,id).steps.push({t:v,done:false});commit();const n=document.querySelector(`.step-in[data-id="${id}"]`);n&&n.focus()},
  addFocus:()=>{const inp=$('#focusIn');const v=inp&&inp.value.trim();if(!v)return inp&&inp.focus();S.focus.items.push({t:v,done:false});commit();const n=$('#focusIn');n&&n.focus()},
  togFocus:i=>{const f=S.focus.items[i];f.done=!f.done;commit()},
  delFocus:i=>{S.focus.items.splice(i,1);commit()},
  loadDemo:()=>{if(S.tx.length+S.subs.length+S.habits.length+S.goals.length&&!confirm(tr('Replace your current data with sample data?')))return;const st=S.settings;S=demo();S.settings=Object.assign(S.settings,{currency:st.currency,theme:st.theme,lang:st.lang});commit();toast(tr('Sample data loaded'))},
  ctab:k=>{ctab=k;showSetup=false;render()},
  goCoach:k=>{ctab=k||'insights';showSetup=false;if(location.hash==='#coach')render();else location.hash='coach'},
  send:()=>{const i=$('#chatIn');if(!i)return;const v=i.value;if(!v.trim())return i.focus();i.value='';sendChat(v)},
  qp:i=>{const q=QP[i];if(!q)return;if(!q[2]){const el=$('#chatIn');el.value=tr('Can I afford ');el.focus();return}sendChat(tr(q[2]))},
  showCtx:()=>{const d=$('#dlg');d.innerHTML=`<form method="dialog" class="fm"><h3>${tr("What's shared with the AI")}</h3><p style="margin:0 0 10px;color:var(--ink-2);font-size:13.5px">${tr('Each time you send a message, this summary and your recent chat go to Anthropic to write the reply. Nothing is sent at any other time.')}</p><pre style="white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin:0">${esc(buildContext())}</pre><div class="fm-actions"><button class="btn primary" value="ok">${tr('Close')}</button></div></form>`;d.showModal()},
  clearChat:()=>{if(confirm(tr('Clear the conversation? Things Calmdeck remembers are kept.'))){S.chat=[];commit()}},
  aiSettings:()=>{showSetup=true;render()},
  aiDisconnect:()=>{if(confirm(tr('Remove your API key from this device?'))){setAi(null);showSetup=false;render();toast(tr('Key removed'))}},
  aiConnect:async(_,btn)=>{
    const key=($('#aiKey').value||'').trim(),model=$('#aiModel').value;
    if(!key){toast(tr('Paste your API key first'));return}
    if(!$('#aiConsent').checked){toast(tr('Please tick the data-sharing box first'));return}
    btn.disabled=true;btn.textContent=tr('Testing…');
    try{const res=await callClaude({key,model},[{role:'user',content:'Reply with one word: ready'}],{stream:false,max:400});await res.json();
      setAi({key,model});showSetup=false;ctab='chat';render();toast(tr('AI Coach connected'))}
    catch(e){btn.disabled=false;btn.textContent=tr('Connect & test');alert(e.message)}
  },
  addFact:()=>{const i=$('#factIn'),v=i&&i.value.trim();if(!v)return i&&i.focus();S.memory.facts.push({id:uid(),text:v.slice(0,200),src:'you',date:today()});commit();const n=$('#factIn');n&&n.focus()},
  delFact:id=>{S.memory.facts=S.memory.facts.filter(f=>f.id!==id);commit()},
  hideInstall:()=>{S.settings.hideInstall=true;commit()},
  install:async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;render()},
  startFresh:()=>{commit();toast(tr('All set. Start by adding a subscription or two.'))},
  reset:()=>{if(confirm(tr('Erase ALL Calmdeck data on this device, including what Calmdeck remembers and your AI key? Export a backup first if unsure.'))){const lang=S.settings.lang;S=blank();S.settings.lang=lang;setAi(null);commit();toast(tr('Everything erased'))}},
  export:()=>{download(`keel-backup-${today()}.json`,JSON.stringify(S,null,2),'application/json');toast(tr('Backup downloaded'))},
  import:()=>$('#file').click(),
  csv:()=>{const rows=[[tr('Date'),tr('Type'),tr('Category'),tr('Description'),tr('Amount')]].concat([...S.tx].sort((a,b)=>a.date<b.date?-1:1).map(x=>[x.date,x.type==='in'?tr('Income'):tr('Expense'),x.type==='in'?tr('Income'):catName(x.cat),x.desc,(x.type==='in'?'':'-')+x.amt.toFixed(2)]));
    download(`keel-transactions-${today()}.csv`,'﻿'+rows.map(r=>r.map(c=>/[",\n]/.test(c)?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n'),'text/csv')},
};
async function download(name,text,type){
  try{const f=new File([text],name,{type});if(IOS&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  legacyDownload(name,text,type)}
function legacyDownload(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;e.preventDefault();fn(el.dataset.id,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='chatIn'){e.preventDefault();A.send()}
  if(e.key==='Enter'&&e.target.id==='factIn'){e.preventDefault();A.addFact()}
  if(e.key==='Enter'&&e.target.id==='focusIn'){e.preventDefault();A.addFocus()}
  if(e.key==='Enter'&&e.target.classList.contains('step-in')){e.preventDefault();A.addStep(e.target.dataset.id)}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#dlg').open||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();A.addTx()}
  const n=+e.key;if(n>=1&&n<=VIEWS.length)location.hash=VIEWS[n-1][0];
});
document.addEventListener('change',e=>{
  const id=e.target.id,st=S.settings;
  if(id==='sName')st.name=e.target.value.trim();
  else if(id==='sCur')st.currency=e.target.value;
  else if(id==='sTheme'){st.theme=e.target.value;theme()}
  else if(id==='sLang'){st.lang=e.target.value;setLang()}
  else if(id==='memAbout')S.memory.about=e.target.value.trim();
  else if(id==='memPri')S.memory.priorities=e.target.value.trim();
  else if(id==='memStyle')S.memory.style=e.target.value;
  else if(id==='file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tx))throw 0;const lang=S.settings.lang;S=Object.assign(blank(),d);S.settings=Object.assign(blank().settings,d.settings||{});if(!d.settings||!d.settings.lang)S.settings.lang=lang;normalize();setLang();commit();toast(tr('Backup restored'))}catch(_){alert(tr('That file is not a valid Calmdeck backup.'))}e.target.value=''};r.readAsText(f);return}
  else return;
  commit();if(id!=='sTheme')toast(tr('Saved'));
});
const mq=matchMedia('(prefers-color-scheme: dark)');
function theme(){const t=S.settings.theme;document.documentElement.dataset.theme=t==='auto'?(mq.matches?'dark':'light'):t}
mq.addEventListener&&mq.addEventListener('change',theme);

/* ---------- render ---------- */
function render(){
  const keepFocus=document.activeElement&&document.activeElement.id;
  $('#main').innerHTML=(DEMO?`<div class="callout" style="margin-bottom:20px"><div>${tr('{b}Live demo{/b} with sample data. Click around freely; changes reset when you reload.',{b:'<b>','/b':'</b>'})}</div><a class="btn primary sm" href="../${LANG==='en'?'':LANG+'/'}#pricing" target="_top">${tr('Get Calmdeck')}</a></div>`:'')+V[view]();
  const nav=VIEWS.map(([k,l])=>`<a class="nav ${k===view?'on':''}" href="#${k}">${ic(k)}${tr(l)}</a>`).join('');
  $('#side').innerHTML=`<div class="brand">${LOGO}Calmdeck</div>${nav}<div class="foot"><span class="lock">${ic('lock').replace('<svg','<svg width="13" height="13"')} ${tr('Private & offline')}</span><br>${tr('Your data stays on this device.')}</div>`;
  $('#mnav').innerHTML=VIEWS.filter(v=>v[0]!=='settings').map(([k,l])=>`<button class="${k===view?'on':''}" onclick="location.hash='${k}'">${ic(k)}${tr(l==='Subscriptions'?'Subs':l)}</button>`).join('');
  if(keepFocus==='focusIn'||keepFocus==='chatIn'){const f=document.getElementById(keepFocus);f&&f.focus()}
  if(view==='coach'&&ctab==='chat')scrollChat();
}
function route(){const h=location.hash.slice(1);view=V[h]?h:'today';render();window.scrollTo(0,0)}
addEventListener('hashchange',route);

/* ---------- sample data (written in the current language) ---------- */
function demo(){
  const s=blank(),t=today(),now=dt(t),m=t.slice(0,7),dom=now.getDate();
  s.settings.name=tr('Sam');
  const day=n=>m+'-'+String(Math.max(1,Math.min(n,dom))).padStart(2,'0');
  s.budgets={Housing:1600,Food:600,Transport:180,Shopping:250,Health:120,Fun:220,Bills:240,Subscriptions:110};
  const rows=[[1,'Salary',4200,'in'],[1,'Rent',1550,'Housing'],[2,'Groceries',86.4,'Food'],[3,'Monthly transit pass',64,'Transport'],[4,'Coffee & pastry',9.8,'Food'],[5,'Electricity',74.2,'Bills'],[6,'Dinner with friends',58,'Fun'],[7,'Pharmacy',23.5,'Health'],[8,'Groceries',112.3,'Food'],[9,'Running shoes',119,'Shopping'],[10,'Internet',55,'Bills'],[11,'Lunch out',14.2,'Food'],[12,'Concert tickets',90,'Fun'],[13,'Fuel',41,'Transport'],[14,'Groceries',95.1,'Food'],[15,'Freelance invoice',650,'in'],[16,'Phone plan',35,'Bills'],[17,'Takeout',27.4,'Food'],[18,'Book',18.99,'Shopping'],[20,'Groceries',101.7,'Food']];
  s.tx=rows.map(([d,desc,amt,c])=>({id:uid(),date:day(d),desc:tr(desc),amt,type:c==='in'?'in':'out',cat:c==='in'?'Income':c}));
  const pm=addMonths(m+'-01',-1).slice(0,7);
  [['Salary',4200,'in'],['Rent',1550,'Housing'],['Groceries',410,'Food'],['Transit',64,'Transport'],['Utilities',160,'Bills'],['Weekend trip',240,'Fun'],['Clothes',85,'Shopping']].forEach(([desc,amt,c],i)=>s.tx.push({id:uid(),date:pm+'-'+String(3+i*3).padStart(2,'0'),desc:tr(desc),amt,type:c==='in'?'in':'out',cat:c==='in'?'Income':c}));
  s.subs=[['Netflix',15.49,'monthly',3],['Spotify',11.99,'monthly',9],['iCloud+ 200 GB',2.99,'monthly',17],['Gym membership',39,'monthly',12,'Went 3× last month',true],['Adobe Creative Cloud',59.99,'monthly',21,'Only use it for occasional photo edits',true],['Amazon Prime',139,'yearly',64],['News subscription',4,'weekly',5],['Language app',59.99,'yearly',140],['Password manager',36,'yearly',201]]
    .map(([name,amt,cycle,d,note,flag])=>({id:uid(),name:tr(name),amt,cycle,next:addDays(t,d),note:note?tr(note):'',flag:!!flag}));
  const H=[['Walk 20 minutes',.85],['Read 10 pages',.7],['No phone after 10pm',.55],['Drink 2L of water',.8]];
  s.habits=H.map(([name,p],k)=>{const log={};for(let i=1;i<40;i++){const r=Math.abs(Math.sin((i+1)*(k+3)*12.9898))%1;if(r<p||i<4-k)log[addDays(t,-i)]=1}if(k<2)log[t]=1;return{id:uid(),name:tr(name),log}});
  const G=(title,why,due,steps)=>({id:uid(),title:tr(title),why:why?tr(why):'',due:addDays(t,due),steps:steps.map(([x,done])=>({t:tr(x,{a:money(400),b:money(3000),c:money(7500)}),done}))});
  s.goals=[
    G('Build a 3-month emergency fund','Sleep better and say no to bad jobs',120,[['Open a separate high-yield savings account',true],['Automate {a} on payday',true],['Cancel 2 unused subscriptions',false],['Hit {b} milestone',false],['Hit {c} (3 months of costs)',false]]),
    G('Run a 10K','Feel strong again',45,[['Buy proper running shoes',true],['Run 3× per week for 4 weeks',true],['Complete a 5K without stopping',true],['Sign up for a local race',false]]),
    G('Launch a side project','',-3,[['Pick one idea and write a one-page plan',true],['Build a first version',false],['Show it to 10 people',false]]),
  ];
  const spf=s.subs.find(x=>x.name==='Spotify');spf.hist=[{date:addDays(t,-20),from:10.99,to:11.99}];
  s.memory={about:tr('32, product designer, renting a flat with my partner. Paid monthly, plus occasional freelance work.'),priorities:tr('Build an emergency fund, run a 10K, spend less on takeout.'),style:'balanced',
    facts:[{id:uid(),text:tr('Wants 3 months of expenses saved by spring'),src:'coach',date:addDays(t,-9)},{id:uid(),text:tr('Cooks at home on weeknights but struggles on Fridays'),src:'you',date:addDays(t,-15)}]};
  const v={trip:money(400),wk:money(100),adobe:money(60)};
  s.chat=[{role:'user',content:tr('Can I afford a {trip} weekend trip next month?',v),t:0},
    {role:'assistant',t:0,content:tr("**Yes, with a little planning.** You're close to your budget this month and you saved about 40% of your income last month, so {trip} is realistic.\n\nTo make it painless:\n- Put {wk} aside each week for the next 4 weeks.\n- Fridays are your priciest day. Two home-cooked Fridays cover about a quarter of it.\n- Cancelling Adobe, which you've flagged, frees {adobe} a month on its own.\n\nWant me to add “Weekend trip fund” as a goal with these steps?",v),saved:[tr('Planning a weekend trip next month, budget about {trip}',v)]}];
  s.focus={week:weekStart(t),items:[{t:tr('Finish the quarterly report'),done:true},{t:tr('Call Mom on Sunday'),done:false},{t:tr('Cancel the Adobe subscription'),done:false}]};
  return s;
}

load();theme();route();
window.__keelMissing=()=>[...MISS];
if(WEB&&!DEMO){
  const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
  add('manifest','manifest.webmanifest');add('apple-touch-icon','icons/apple-touch-icon.png');
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view==='today')render()});
  addEventListener('appinstalled',()=>{installEvt=null;toast(tr('Calmdeck installed'));render()});
}
})();
